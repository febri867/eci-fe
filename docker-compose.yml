services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: take-home-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    environment:
      NODE_ENV: development
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_nuxt: